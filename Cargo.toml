[package]
name = "pi-agent-rust"
version = "0.1.0"
edition = "2021"
authors = ["Antigravity <pi-agent@rust.dev>"]
description = "Superpowerful, lightweight pure-Rust Pi Coding Agent clone with embedded AI coding memory and multi-LLM routing"

[dependencies]
# Async runtime & networking
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "multipart"] }
futures-util = "0.3"
eventsource-stream = "0.2"
async-trait = "0.1"

# Serialization & format
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# CLI & Terminal UI
clap = { version = "4.5", features = ["derive", "env"] }
ratatui = "0.28"
crossterm = { version = "0.28", features = ["event-stream"] }
colored = "2.1"
indicatif = "0.17"

# File search & git handling
regex = "1.10"
glob = "0.3"
ignore = "0.4"
walkdir = "2.5"

# Cryptography, time & IDs
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
sha2 = "0.10"
hex = "0.4"

# Utilities
tempfile = "3.10"
dirs = "5.0"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dialoguer = "0.12.0"
webbrowser = "1.2.4"
url = "2.5.8"
futures-executor = "0.3.34"
sysinfo = "0.39.6"
rayon = "1.12.0"
dotenvy = "0.15.7"
tracing-appender = "0.2.5"
rookie = "0.5.6"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.10"
